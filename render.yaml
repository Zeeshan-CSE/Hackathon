# Render Blueprint: one web service + one managed PostgreSQL database
services:
  - type: web
    name: lifelink
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: lifelink-db, property: connectionString }
      - key: NODE_VERSION
        value: 20
databases:
  - name: lifelink-db
    plan: free
