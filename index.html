<script type="text/babel">
const {useState,useMemo,useEffect,useRef}=React;
const BG=['A+','A-','B+','B-','AB+','AB-','O+','O-'];
const CAN={'O-':BG,'O+':['O+','A+','B+','AB+'],'A-':['A-','A+','AB-','AB+'],'A+':['A+','AB+'],'B-':['B-','B+','AB-','AB+'],'B+':['B+','AB+'],'AB-':['AB-','AB+'],'AB+':['AB+']};
const STEPS=['Matching','Donors Notified','Awaiting Response','Donation Coordinated','Fulfilled','Completed'];
const CITY={Karachi:[24.86,67.01],Jamshoro:[25.41,68.27],Hyderabad:[25.39,68.37]};
const L={
 title:{en:'Blood, when every minute counts',ur:'جب ہر منٹ قیمتی ہو، خون بروقت',sd:'جڏهن هر منٽ قيمتي هجي، رت وقت تي'},
 sub:{en:'Verified requests, compatible donors, coordinated donation.',ur:'تصدیق شدہ درخواستیں، موزوں ڈونرز، منظم عطیہ۔',sd:'تصديق ٿيل درخواستون، مناسب ڊونرز، منظم عطيو.'},
 cta:{en:'Request blood now',ur:'ابھی خون کی درخواست کریں',sd:'هاڻي رت جي درخواست ڪريو'},

};
const rad=x=>x*Math.PI/180;
const km=(a,b)=>{const R=6371,dl=rad(b.lat-a.lat),dg=rad(b.lng-a.lng);const q=Math.sin(dl/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dg/2)**2;return Math.round(R*2*Math.asin(Math.sqrt(q))*10)/10};

// matching utility: medical compatibility first, then distance, availability, 56 day rule
function calculateDonorMatchScore(dn,rq,h){
  const dist=km(dn,h);
  if(!CAN[dn.bg].includes(rq.bg)) return {score:0,dist,eligible:false,available:false,why:'Ineligible'};
  const age=dn.age||28,eligible=dn.lastDays>=56&&age>=18&&age<=65, available=dn.available&&!dn.suspended&&!(dn.pauseUntil>Date.now());
  let s=50*Math.max(0,1-dist/(rq.urgency==='Critical'?15:30));
  s+=available?20:0;
  s+=eligible?20:Math.max(0,dn.lastDays/56*8);
  s+=dn.bg===rq.bg?10:5;const ra=dn.acc||0,rd=dn.dec||0;s+=ra+rd?Math.round(5*(ra-rd)/(ra+rd)):0;
  return {score:Math.min(100,Math.round(s)),dist,eligible,available,why:null};
}
const acceptProb=(x)=>Math.max(5,Math.min(95,Math.round(88-x.dist*2.2-(x.available?0:35)-(x.eligible?0:20)+(new Date().getHours()>=8&&new Date().getHours()<=22?4:-12))));
// privacy wrapper: contact only visible after acceptance
const mask=(dn,resp,dist)=>(resp==='Accepted'||resp==='Donated')?{label:dn.name,phone:dn.phone,email:dn.email}:{label:'Compatible Donor • '+dist+' km away',phone:'••• •••• ••••',email:'••••@••••'};

const ago=t=>{const m=Math.round((Date.now()-t)/60000);return m<1?'just now':m<60?m+' min ago':Math.round(m/60)+' h ago'};
const left=r=>{const ms=r.created+r.deadline*3600000-Date.now();if(ms<=0)return 'Overdue';return Math.floor(ms/3600000)+'h '+Math.floor(ms%3600000/60000)+'m left'};
const now=Date.now();
const mk=(id,name,bg,city,dx,dy,av,days,tot,ph)=>({id,name,bg,city,lat:CITY[city][0]+dx,lng:CITY[city][1]+dy,available:av,lastDays:days,total:tot,phone:ph,email:name.split(' ')[0].toLowerCase()+'@mail.pk',suspended:false});
const seed=()=>addHyd({
 donors:[mk('d1','Ali Raza','B+','Karachi',.011,.02,true,120,6,'0300 1112233'),mk('d2','Hina Siddiqui','O-','Karachi',.04,.07,true,90,9,'0301 2223344'),mk('d3','Bilal Ahmed','A+','Karachi',-.015,-.005,true,30,3,'0302 3334455'),mk('d4','Zainab Shah','B-','Karachi',-.04,.09,true,200,4,'0303 4445566'),mk('d5','Imran Malik','AB+','Karachi',.07,.1,false,150,2,'0304 5556677'),mk('d6','Saad Memon','O+','Jamshoro',-.01,-.005,true,75,5,'0305 6667788')],
 hospitals:[
  {id:'h1',name:'Civil Hospital Karachi',city:'Karachi',lat:24.8591,lng:67.0099,stock:{'A+':8,'A-':2,'B+':1,'B-':0,'AB+':4,'AB-':1,'O+':6,'O-':2}},
  {id:'h2',name:'Aga Khan University Hospital',city:'Karachi',lat:24.892,lng:67.0745,stock:{'A+':12,'A-':4,'B+':9,'B-':3,'AB+':5,'AB-':2,'O+':14,'O-':5}},
  {id:'h3',name:'Liaquat University Hospital',city:'Jamshoro',lat:25.417,lng:68.275,stock:{'A+':3,'A-':0,'B+':2,'B-':1,'AB+':1,'AB-':0,'O+':4,'O-':1}},
  {id:'h4',name:'Indus Hospital',city:'Karachi',lat:24.8365,lng:67.125,stock:{'A+':10,'A-':3,'B+':7,'B-':2,'AB+':3,'AB-':2,'O+':11,'O-':4}}],
 requests:[
  {id:'R1',patient:'Hamza Qureshi',bg:'B+',units:2,got:0,hid:'h1',city:'Karachi',urgency:'Critical',deadline:6,status:'Awaiting Response',verified:true,user:'Sara Khan',flagged:false,resp:{d1:'Pending',d2:'Declined',d4:'Pending'},created:now-50*60000},
  {id:'R2',patient:'Maryam Noor',bg:'O+',units:3,got:0,hid:'h2',city:'Karachi',urgency:'Urgent',deadline:12,status:'Donors Notified',verified:false,user:'Sara Khan',flagged:false,resp:{d6:'Pending',d2:'Pending'},created:now-25*60000},
  {id:'R3',patient:'Faheem Jatoi',bg:'AB-',units:4,got:0,hid:'h3',city:'Jamshoro',urgency:'Critical',deadline:8,status:'Donors Notified',verified:false,user:'Omar Farooq',flagged:false,resp:{d2:'Pending'},created:now-10*60000}],
 notes:[
  {id:'n1',to:'donor:d1',text:'New suitable request: 2 units B+ at Civil Hospital Karachi (Critical)',ts:now-48*60000,read:false},
  {id:'n2',to:'donor:d4',text:'New suitable request: 2 units B+ at Civil Hospital Karachi (Critical)',ts:now-48*60000,read:false},
  {id:'n3',to:'coordinator',text:'Donor Hina Siddiqui declined request R1',ts:now-30*60000,read:false},
  {id:'n4',to:'coordinator',text:'New request R2 awaiting verification',ts:now-25*60000,read:false},
  {id:'n5',to:'coordinator',text:'New request R3 awaiting verification',ts:now-10*60000,read:false},
  {id:'n6',to:'donor:d6',text:'New suitable request: 3 units O+ at Aga Khan University Hospital (Urgent)',ts:now-24*60000,read:false},
  {id:'n7',to:'donor:d2',text:'New suitable request: 3 units O+ at Aga Khan University Hospital (Urgent)',ts:now-24*60000,read:false},
  {id:'n8',to:'donor:d2',text:'New suitable request: 4 units AB- at Liaquat University Hospital (Critical)',ts:now-9*60000,read:false},
  {id:'n9',to:'admin',text:'Request R3 created by Omar Farooq',ts:now-10*60000,read:false}],
 logs:[{ts:now-50*60000,t:'R1 created, verified and 3 donors notified'},{ts:now-25*60000,t:'R2 created by Sara Khan'},{ts:now-10*60000,t:'R3 created by Omar Farooq'}],
 base:{fulfilled:41,total:58},
 users:[{id:'ua',role:'admin',name:'System Admin',email:'admin@lifelink.pk',pw:H('Admin@123')},{id:'uc',role:'coordinator',name:'Hospital Coordinator',email:'coord@lifelink.pk',pw:H('Coord@123')},{id:'ur1',role:'requester',name:'Sara Khan',email:'sara@mail.pk',pw:H('Sara@123')},{id:'ur2',role:'requester',name:'Omar Farooq',email:'omar@mail.pk',pw:H('Omar@123')}].concat([['d1','Ali Raza','ali'],['d2','Hina Siddiqui','hina'],['d3','Bilal Ahmed','bilal'],['d4','Zainab Shah','zainab'],['d5','Imran Malik','imran'],['d6','Saad Memon','saad']].map(([id,n,e])=>({id:'u'+id,role:'donor',name:n,email:e+'@mail.pk',pw:H('Donor@123'),donorId:id})))
});

// ---- workflow actions, each mutates a cloned draft ----
const nid=()=>Math.random().toString(36).slice(2,8);
const note=(d,to,text)=>d.notes.unshift({id:nid(),to,text,ts:Date.now(),read:false});
const logA=(d,t)=>d.logs.unshift({ts:Date.now(),t});
const getH=(d,id)=>d.hospitals.find(x=>x.id===id);
const getR=(d,id)=>d.requests.find(x=>x.id===id);
const rank=(d,r)=>d.donors.map(x=>({d:x,...calculateDonorMatchScore(x,r,getH(d,r.hid))})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);
const final=r=>['Fulfilled','Completed','Rejected','Cancelled','Expired'].includes(r.status);
const act={
 create(d,f,user){const h=getH(d,f.hid);const id='R'+(d.requests.length+1);
  d.requests.push({id,patient:f.patient,bg:f.bg,units:+f.units,got:0,hid:f.hid,city:h.city,urgency:f.urgency,deadline:+f.deadline,status:'Pending Verification',user,flagged:false,resp:{},created:Date.now()});
  note(d,'coordinator','New request '+id+' awaiting verification');note(d,'admin','New request '+id+' created by '+user);
  note(d,'requester:'+user,'Request '+id+' created, pending verification');logA(d,id+' created by '+user);return id},
 verify(d,id){const r=getR(d,id);r.status='Matching';const n=rank(d,r).filter(x=>x.available&&x.eligible).length;
  note(d,'requester:'+r.user,'Request '+id+' verified. '+n+' compatible donors found and ranked');
  note(d,'coordinator','Request '+id+' verified, '+n+' ready donors ranked');logA(d,id+' verified, matching ran ('+n+' ready donors)')},
 reject(d,id){const r=getR(d,id);r.status='Rejected';note(d,'requester:'+r.user,'Request '+id+' was rejected during verification');logA(d,id+' rejected')},
 cancel(d,id){const r=getR(d,id);r.status='Cancelled';note(d,'coordinator','Request '+id+' cancelled by requester');logA(d,id+' cancelled')},
 flag(d,id){const r=getR(d,id);r.flagged=!r.flagged;logA(d,id+(r.flagged?' flagged as suspicious':' flag removed'))},
 alert(d,id,n,tag){const r=getR(d,id);let rd_=r.radius||10,bs=rank(d,r).filter(x=>x.available&&x.eligible&&!(x.d.id in r.resp)),c=[];while(rd_<=50){c=bs.filter(x=>x.dist<=rd_).slice(0,n);if(c.length>=Math.min(n,bs.length)||(c.length&&rd_>=50))break;rd_+=10}if(rd_>(r.radius||10))logA(d,id+': search radius expanded to '+Math.min(rd_,50)+' km');r.radius=Math.min(rd_,50);
  if(!c.length){logA(d,id+': no further eligible donors in range');return 0}
  c.forEach(x=>{r.resp[x.d.id]='Pending';note(d,'donor:'+x.d.id,(r.urgency==='Critical'?'URGENT ':'')+r.bg+' BLOOD REQUIRED, '+getH(d,r.hid).name+', approx '+x.dist+' km away, '+r.units+' units, needed within '+r.deadline+' h (in-app, SMS, email)')});
  if(r.status==='Matching'||r.status==='Verified')r.status='Donors Notified';
  note(d,'requester:'+r.user,c.length+' donors notified for '+id);logA(d,id+': '+c.length+' donors notified ('+tag+')');return c.length},
 respond(d,id,did,ans){const r=getR(d,id),dn=d.donors.find(x=>x.id===did);r.resp[did]=ans;
  note(d,'coordinator',dn.name+' '+ans.toLowerCase()+' request '+id);note(d,'requester:'+r.user,'A donor '+ans.toLowerCase()+' your request '+id);
  if(ans==='Accepted'&&!final(r))r.status=r.got>0?'Partially Fulfilled':'Donation Coordinated';else if(r.status==='Donors Notified')r.status='Awaiting Response';
  logA(d,dn.name+' '+ans.toLowerCase()+' '+id)},
 confirm(d,id,did){const r=getR(d,id),dn=d.donors.find(x=>x.id===did);r.resp[did]='Donated';r.got++;dn.total++;dn.lastDays=0;
  note(d,'donor:'+did,'Donation confirmed for '+id+'. Thank you!');note(d,'requester:'+r.user,'Donation confirmed for '+id+' ('+r.got+'/'+r.units+' units)');
  if(r.got>=r.units){r.status='Fulfilled';r.doneAt=Date.now();note(d,'requester:'+r.user,'Request '+id+' fulfilled');note(d,'coordinator','Request '+id+' fulfilled')}else{r.status='Partially Fulfilled';if(acc(r)<r.units-r.got)act.alert(d,id,r.units-r.got-acc(r),'auto: units still needed')}
  logA(d,'Donation confirmed: '+dn.name+' for '+id)},
 fulfil(d,id){const r=getR(d,id);r.status='Fulfilled';r.doneAt=Date.now();note(d,'coordinator','Request '+id+' marked fulfilled');logA(d,id+' closed as fulfilled')}
};

const acc=r=>Object.values(r.resp).filter(x=>x==='Accepted').length;
const tellDonors=(d,r,t)=>Object.keys(r.resp).forEach(k=>{if(r.resp[k]==='Pending'||r.resp[k]==='Accepted')note(d,'donor:'+k,t)});
Object.assign(act,{
 create(d,f,user){const h=getH(d,f.hid);const id='R'+(d.requests.length+1);
  d.requests.push({id,patient:f.patient,bg:f.bg,units:+f.units,got:0,hid:f.hid,city:h.city,urgency:f.urgency,deadline:+f.deadline,status:'Matching',verified:false,user,flagged:false,resp:{},created:Date.now()});
  note(d,'coordinator','New '+f.urgency+' request '+id+' ('+f.units+' units '+f.bg+') needs verification');note(d,'admin','Request '+id+' created by '+user);

function metrics(db){const rq=db.requests,fu=rq.filter(r=>['Fulfilled','Completed'].includes(r.status)),act_=rq.filter(r=>!final(r));

 const rts=rq.flatMap(r=>Object.keys(r.rt||{}).map(k=>(r.rt[k]-r.created)/60000));return {rate:Math.round((fu.length+db.base.fulfilled)/(rq.length+db.base.total)*100),rsp:rts.length?Math.round(rts.reduce((a,b)=>a+b,0)/rts.length):'n/a',regd:db.donors.length,total:rq.length+db.base.total,active:act_.length,fulfilled:fu.length+db.base.fulfilled,pending:rq.filter(r=>!r.verified&&!final(r)).length,crit:act_.filter(r=>r.urgency==='Critical').length,avail:db.donors.filter(x=>x.available&&!x.suspended&&x.lastDays>=56).length,resp:resp.filter(x=>x!=='Pending').length,dons,avg:hrs.length?(hrs.reduce((a,b)=>a+b,0)/hrs.length).toFixed(1):'2.4'}}

function Assistant({c}){const [q,setQ]=useState('');const [chat,setChat]=useState([{b:1,t:'Ask me: "Find available O- donors within 10 km", "Summarize emergency requests", "Show low stock hospitals".'}]);

  return 'I can find donors, summarize requests, and report low stock hospitals.'};

function Login({role,c,back,done}){

 const submit=()=>{const em=f.email.trim().toLowerCase();
  if(mode==='in'){const u=c.db.users.find(x=>x.role===role&&x.email===em&&x.pw===H(f.pw));
   if(!u)return setErr('Incorrect email or password for the '+R.t+' portal.');
   if(u.donorId&&c.db.donors.find(x=>x.id===u.donorId&&x.suspended))return setErr('This account is suspended. Contact the administrator.');
   return done(u)}
  if(f.name.trim().length<3)return setErr('Enter your full name');
  if(!/^\S+@\S+\.\S+$/.test(em))return setErr('Enter a valid email address');
  if(f.pw.length<6)return setErr('Password needs at least 6 characters');

  const did='d'+nid(),u={id:'u'+nid(),role,name:f.name.trim(),email:em,pw:H(f.pw)};if(role==='donor')u.donorId=did;
  c.upd(d=>{if(role==='donor'){d.donors.push({id:did,name:u.name,bg:f.bg,city:f.city,lat:CITY[f.city][0]+.01,lng:CITY[f.city][1]+.01,available:true,lastDays:90,total:0,phone:f.phone||'Not provided',email:em,suspended:false});logA(d,'New donor registered: '+u.name)}else logA(d,'New requester registered: '+u.name);d.users.push(u)});
  done(u)};
 return <div className="max-w-md mx-auto pt-4 space-y-4">
  <button onClick={back} className="text-sm text-slate-400 hover:text-white">← All portals</button>

function LiveMap({c,r,did,close}){useTick(500);const {db,upd}=c,dn=db.donors.find(x=>x.id===did);if(!r||!dn)return null;
 const h=getH(db,r.hid),t0=r.go&&r.go[did],dist=km(dn,h),p=t0?Math.min(1,(Date.now()-t0)/1000/demoT(dist)):0,cur=Math.round(dist*(1-p)*10)/10,sc=nice(Math.max(dist,1)),R=92;
 const ang=Math.atan2(-(dn.lat-h.lat),(dn.lng-h.lng)*Math.cos(rad(h.lat))),ux=Math.cos(ang),uy=Math.sin(ang),bx=ux*cur/sc*R,by=uy*cur/sc*R,mine=c.me===did,eta=Math.ceil(cur/30*60);

  useEffect(()=>{let un;(async()=>{try{if(!window.claude)return;const d=await claude.use('db');if(!d)return;const q=sy.current;q.doc=d.doc('app/state');
   un=q.doc.onSnapshot(snap=>{const j=snap.exists&&snap.data().json;if(!j){q.ready=true;q.last='';setDb(p=>({...p}));return}if(j===q.last){q.ready=true;return}q.last=j;q.ready=true;q.remote=true;setDb(JSON.parse(j))},()=>{})}catch(e){}})();return()=>un&&un()},[]);
 // server sync (deployed backend): pulls the shared state every 3 s and pushes local changes; used when the hosted-db runtime is absent
 useEffect(()=>{if(window.claude)return;let stop=false,ver=0,t;const q=sy.current;
  const pull=async()=>{try{const r=await fetch(API+'/api/state?since='+ver,{cache:'no-store'});if(r.status===204){q.ready=true}else if(r.ok){const d=await r.json();ver=d.version;if(d.json){if(d.json!==q.last){q.last=d.json;q.remote=true;setDb(JSON.parse(d.json))}q.ready=true}else{q.ready=true;q.last='';setDb(p=>({...p}))}}}catch(e){}if(!stop)t=setTimeout(pull,3000)};pull();return()=>{stop=true;clearTimeout(t)}},[]);
 useEffect(()=>{document.documentElement.dir=lang==='en'?'ltr':'rtl'},[lang]);
 useEffect(()=>{try{localStorage.setItem('ll_db3',JSON.stringify(db))}catch(e){}},[db]);
 useEffect(()=>{upd(d=>act.expire(d));const i=setInterval(()=>setDb(p=>{const d=structuredClone(p);act.expire(d);return d}),60000);return()=>clearInterval(i)},[]);
 const user=sess&&db.users.find(u=>u.id===sess.id);
 const signIn=u=>{try{sessionStorage.setItem('ll_s',JSON.stringify({id:u.id}))}catch(e){}setSess({id:u.id});window.scrollTo(0,0)};
 const out=()=>{try{sessionStorage.removeItem('ll_s')}catch(e){}setSess(null);setPage('portal')};
 const c={db,upd,lang,me:user&&user.donorId,user:user&&user.name,intent:''};
 const role=user&&user.role;
 return <div className="min-h-screen"><a href="#main" className="ll-skip">Skip to main content</a>
  <header className="sticky top-0 z-40 bg-gray-900/95 backdrop-blur border-b border-slate-700/60"><div className="max-w-6xl mx-auto px-4 h-14 flex items-center gap-3">
   <button onClick={()=>setPage('portal')} className="font-extrabold text-white flex items-center gap-2"><span className="w-7 h-7 rounded-lg bg-red-700 grid place-items-center text-sm">♥</span>LifeLink</button>
   <div className="ml-auto flex items-center gap-2"><select aria-label="Language" className="!w-auto !py-1 text-sm" value={lang} onChange={e=>setLang(e.target.value)}><option value="en">English</option><option value="ur">اردو</option><option value="sd">سنڌي</option></select>
   {user&&<Btn v="s" onClick={out}>Log out</Btn>}</div></div></header>
  <main id="main" tabIndex={-1} className="max-w-6xl mx-auto px-4 py-5 md:py-8">
   {user&&<div className="flex flex-wrap items-center gap-3 mb-4 bg-slate-800 border border-slate-700/50 rounded-xl px-4 py-2 text-sm"><span className="text-xl">{ROLES[role].i}</span><b className="text-white">{user.name}</b><span className="text-emerald-300 font-semibold">{ROLES[role].t} portal</span><span className="ml-auto text-xs text-slate-500">{user.email}</span></div>}
   {!user&&page==='portal'&&<Home c={c} go={setPage}/>}
   {!user&&page!=='portal'&&<Login role={page} c={c} back={()=>setPage('portal')} done={signIn}/>}
   {role==='requester'&&<Requester c={c}/>}{role==='donor'&&<Donor c={c}/>}{role==='coordinator'&&<Coordinator c={c}/>}{role==='admin'&&<Admin c={c}/>}
   {!user&&page==='portal'&&<div className="text-center mt-10"><button className="text-xs text-slate-500 hover:text-slate-300" onClick={()=>{if(confirm('Reset all demo data and accounts?'))setDb(seed())}}>Reset demo data</button></div>}
  </main><FloatingBot key={role||'guest'} c={c} role={role||'guest'}/></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
